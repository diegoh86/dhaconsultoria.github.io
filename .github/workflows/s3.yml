name: Deploy HTML site to S3

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-2' }}

      - name: Sync files to S3
        run: |
          BUCKET_NAME="${{ secrets.S3_BUCKET_NAME }}"
          if [ -z "$BUCKET_NAME" ]; then
            BUCKET_NAME="dhaconsultoria"
          fi
          echo "Syncing to s3://$BUCKET_NAME..."
          aws s3 sync ./ "s3://$BUCKET_NAME" --delete --exclude '.git/*' --exclude '.github/*' --exclude 'node_modules/*' --exclude '.vite/*'
